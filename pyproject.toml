# ─────────────────────────────────────────────────────────────────────
#  Energy Forecasting — Project metadata & tool configuration
# ─────────────────────────────────────────────────────────────────────
#  Single source of truth for: package metadata, build backend, and
#  all developer-tool configuration (black, isort, mypy, pytest, cov).
#  Keeping these in one file means a contributor can find every project
#  setting without hunting through dotfiles.
# ─────────────────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ────────────────────────────────────────────────
[project]
name = "energy-forecasting"
version = "0.1.0"
description = "Time-series forecasting of household electricity consumption (Enel × LUISS Project Work)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Thierry Ishimwe", email = "ishimwethierry2002@gmail.com" },
]
keywords = ["time-series", "forecasting", "energy", "SARIMA", "LSTM", "Prophet", "XGBoost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are sourced from requirements.txt to keep a
# single authoritative list. The minimal entries here let `pip install -e .`
# work; the full pinned set is installed via `pip install -r requirements.txt`.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.10",
    "pre-commit>=4.0",
]

[project.urls]
Repository = "https://github.com/ThierryIshimwe/energy-forecasting"

# CLI entry points: each script becomes `<name>` on the PATH after install.
[project.scripts]
energy-download = "energy_forecasting.scripts.download_data:main"
energy-features = "energy_forecasting.scripts.build_features:main"
energy-train = "energy_forecasting.scripts.train:main"
energy-evaluate = "energy_forecasting.scripts.evaluate:main"

# ── Package discovery ───────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]
include = ["energy_forecasting*"]

[tool.setuptools.package-data]
energy_forecasting = ["py.typed"]

# ── Black (formatter) ───────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    notebooks/_legacy
  | data
  | reports/output
  | mlruns
)/
'''

# ── isort (import sorter) ───────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["energy_forecasting"]
skip = ["notebooks/_legacy", "data"]

# ── mypy (static type checker) ──────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
files = ["src/energy_forecasting"]

# Third-party libraries without complete type stubs are tolerated.
[[tool.mypy.overrides]]
module = [
    "statsmodels.*",
    "pmdarima.*",
    "xgboost.*",
    "prophet.*",
    "optuna.*",
    "mlflow.*",
    "plotly.*",
    "streamlit.*",
    "sklearn.*",
    "holidays.*",
]
ignore_missing_imports = true

# ── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",                        # show short summary for all non-pass
    "--strict-markers",           # fail on undeclared markers
    "--strict-config",
    "--cov=energy_forecasting",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: end-to-end pipeline tests",
    "leakage: critical leakage-prevention tests (must always pass)",
]

# ── Coverage ────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/energy_forecasting"]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
